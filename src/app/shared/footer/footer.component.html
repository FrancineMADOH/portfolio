<footer class="footer">
  <div class="footer__inner">
    <p class="footer__copyright">© {{ currentYear }} Francine MADOH. {{ 'footer.rights' | translate }}</p>
    <ul class="footer__links" [attr.aria-label]="'footer.links' | translate">
      <li><a [href]="links.github" target="_blank" rel="noopener">GitHub</a></li>
      <li><a [href]="links.linkedin" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a [href]="links.email">{{ 'footer.email' | translate }}</a></li>
    </ul>
    <p class="footer__stack">{{ 'footer.built_with' | translate }}</p>
  </div>
</footer>
